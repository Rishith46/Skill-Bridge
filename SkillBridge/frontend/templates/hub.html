{% extends "layout.html" %}
{% block content %}
<div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div class="lg:col-span-2 card-glass p-6">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold">Collaboration Hub</h2>
      <div class="text-sm text-gray-400">Status: Active</div>
    </div>

    <div class="mt-4">
      <div class="flex gap-3 border-b border-white/6 pb-3">
        <button class="chip">Pending Requests</button>
        <button class="chip">Active Projects</button>
        <button class="chip">Completed</button>
      </div>

      <div class="mt-6 grid grid-cols-1 gap-4">
        <div class="p-4 card-glass rounded-xl">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-full avatar-gradient flex items-center justify-center">AL</div>
            <div class="flex-1">
              <div class="font-medium">Campus App — Chat</div>
              <div class="text-xs text-gray-400">Last message: "Pushed the component"</div>
            </div>
            <div class="text-xs text-gray-400">2h ago</div>
          </div>
        </div>

        <div class="p-4 card-glass rounded-xl">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-full avatar-gradient flex items-center justify-center">SM</div>
            <div class="flex-1">
              <div class="font-medium">Hackathon Build — Tasks</div>
              <div class="text-xs text-gray-400">3 open tasks</div>
            </div>
            <div class="text-xs text-gray-400">1d ago</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="space-y-4">
    <div class="card-glass p-4">
      <h4 class="font-semibold">Your Status</h4>
      <div class="mt-2 text-sm text-gray-400">Available · 4 hours/week</div>
    </div>

    <div class="card-glass p-4">
      <h4 class="font-semibold">Team Activity</h4>
      <div class="mt-2 text-sm text-gray-400">5 active collaborators</div>
    </div>
  </aside>
</div>
{% endblock %}
