{% extends 'layout.html' %}
{% block content %}
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Create Project</h2>
    <form id="projectForm">
      <input name="title" placeholder="Title" class="w-full p-2 border rounded mb-2" />
      <textarea name="description" placeholder="Description" class="w-full p-2 border rounded mb-2"></textarea>
      <div id="requiredSkills" class="space-y-2"></div>
      <button class="mt-4 px-4 py-2 bg-blue-600 text-white rounded">Create</button>
    </form>
  </div>
{% endblock %}
